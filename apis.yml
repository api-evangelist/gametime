aid: gametime
name: Gametime
description: >-
  Gametime is a mobile-first ticket marketplace for last-minute tickets to live
  sports, concerts, comedy, and theater across the United States and Canada.
  Founded in 2012 by Brad Griffith and headquartered in San Francisco, Gametime
  United, Inc. lets fans buy tickets up to roughly 90 minutes after an event
  begins, with all-in (fee-inclusive) pricing, a two-tap checkout, mobile ticket
  delivery, and buyer guarantees (Lowest Price Guarantee and lightning refunds).
  The company is backed by Accel, GV, and others. Gametime does not publish a
  public developer API; it runs a B2B "API Seller" program for professional
  point-of-sale sellers. This profile was added to the API Evangelist network as
  a portfolio-lead stub and enriched with identity and domain-security data.
